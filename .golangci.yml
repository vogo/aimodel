# golangci-lint configuration.
#
# Migration window only (v0.5.1 → v0.6.0): the canonical API carries
# `Deprecated:` comments so downstream callers get a staticcheck signal, but
# this repository still implements that API, so SA1019 would fire on every
# internal use. The rest of the default check set stays on.
#
# Delete this file once the canonical layer is removed — nothing else here
# deviates from the defaults.
version: "2"

linters:
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -SA1019
